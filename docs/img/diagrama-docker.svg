<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-label="Las dos piezas en Docker: la interfaz publica el puerto 8090 y la API queda dentro de la red interna"><title>Las dos piezas en Docker: la interfaz publica el puerto 8090 y la API queda dentro de la red interna</title><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0063b1"/></marker></defs><rect width="800" height="540" fill="#ffffff"/><rect x="0" y="175" width="150" height="90" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="75" y="208.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">Tu navegador</text><text x="75" y="232.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#636975" text-anchor="middle">pestaña Puertos</text><text x="75" y="249.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#636975" text-anchor="middle">del Codespace</text><rect x="215" y="10" width="585" height="440" rx="10" fill="#ffffff" stroke="#0063b1" stroke-width="1.8" stroke-dasharray="7 5"/><text x="232" y="36.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="16" font-weight="700" fill="#003769" text-anchor="start">Red interna de Compose</text><text x="232" y="56.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#636975" text-anchor="start">Los dos contenedores se ven entre ellos por su nombre.</text><rect x="235" y="100" width="240" height="200" rx="6" fill="#d8eaff" stroke="#003769" stroke-width="1.6"/><text x="355" y="130.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="18" font-weight="700" fill="#003769" text-anchor="middle">cafe-interfaz</text><text x="355" y="156.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">Página web del taller.</text><text x="355" y="175.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">Muestra tu repositorio,</text><text x="355" y="194.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">el modelo y su huella.</text><rect x="250.0" y="226" width="210" height="26" rx="13" fill="#fff" stroke="#0063b1" stroke-width="1.2"/><text x="355" y="244.0" font-family="Consolas,'Cascadia Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#002a52" text-anchor="middle">puerto 8090 publicado</text><text x="355" y="280.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="13" font-weight="400" fill="#636975" text-anchor="middle">Arranca cuando la API está sana</text><rect x="555" y="100" width="225" height="200" rx="6" fill="#d8eaff" stroke="#003769" stroke-width="1.6"/><text x="667" y="130.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="18" font-weight="700" fill="#003769" text-anchor="middle">cafe-api</text><text x="667" y="156.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">Sirve el modelo.</text><text x="667" y="175.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">El modelo va dentro</text><text x="667" y="194.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">de la imagen.</text><rect x="564.5" y="226" width="205" height="26" rx="13" fill="#fff" stroke="#0063b1" stroke-width="1.2"/><text x="667" y="244.0" font-family="Consolas,'Cascadia Mono','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#002a52" text-anchor="middle">puerto 8080 sin publicar</text><text x="667" y="280.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="13" font-weight="400" fill="#636975" text-anchor="middle">Usuario 10001, no es root</text><line x1="153" y1="220" x2="233" y2="200" stroke="#0063b1" stroke-width="2.4" marker-end="url(#fl)"/><text x="176" y="205.0" font-family="Consolas,'Cascadia Mono','DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#002a52" text-anchor="middle">8090</text><line x1="477" y1="200" x2="553" y2="200" stroke="#0063b1" stroke-width="2.4" marker-end="url(#fl)"/><text x="515" y="188.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#636975" text-anchor="middle">API</text><rect x="250" y="350" width="210" height="70" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/><text x="355" y="378.0" font-family="Consolas,'Cascadia Mono','DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">data/processed</text><text x="355" y="402.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="13.5" font-weight="400" fill="#636975" text-anchor="middle">cafe.db (los datos)</text><line x1="355" y1="348" x2="355" y2="303" stroke="#6b7280" stroke-width="2.2" marker-end="url(#fl)"/><text x="366" y="330.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start">montado en solo lectura (:ro)</text><rect x="0" y="470" width="800" height="60" rx="6" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/><text x="16" y="495.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Desde fuera solo se llega a la interfaz. La API no se publica: la interfaz la llama dentro de la red,</text><text x="16" y="515.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">en http://api:8080. Los datos no van en la imagen: se montan en solo lectura.</text></svg>