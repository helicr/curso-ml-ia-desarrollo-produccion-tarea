<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" aria-label="CI/CD en GitHub Actions: Validar, y Nueva version del modelo con dos puertas y dos resultados posibles"><title>CI/CD en GitHub Actions: Validar, y Nueva version del modelo con dos puertas y dos resultados posibles</title><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0063b1"/></marker></defs><rect width="800" height="700" fill="#ffffff"/><rect x="0" y="0" width="800" height="92" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="16" y="28.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="17" font-weight="700" fill="#003769" text-anchor="start">Validar</text><text x="100" y="28.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#636975" text-anchor="start">se ejecuta en cada push, en cada pull request y a mano</text><text x="16" y="54.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Pasa las pruebas, repite el pipeline, construye las dos imágenes y levanta los contenedores.</text><text x="16" y="76.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">No publica nada. Resultado esperado: en verde.</text><text x="0" y="128.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="17" font-weight="700" fill="#003769" text-anchor="start">Nueva version del modelo</text><text x="232" y="128.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#636975" text-anchor="start">se lanza a mano con hasta = 2018</text><rect x="0" y="146" width="400" height="66" rx="6" fill="#eef6ff" stroke="#003769" stroke-width="1.6"/><text x="14" y="171.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="15.5" font-weight="700" fill="#003769" text-anchor="start">1. Reentrenar</text><text x="14" y="193.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Con los lotes nuevos, hasta el año 2018.</text><line x1="200" y1="214" x2="200" y2="238" stroke="#0063b1" stroke-width="2.2" marker-end="url(#fl)"/><rect x="0" y="240" width="400" height="100" rx="6" fill="#d8eaff" stroke="#002a52" stroke-width="2.6"/><text x="14" y="265.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="15.5" font-weight="700" fill="#003769" text-anchor="start">Puerta 1: comparación con la referencia</text><text x="14" y="287.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">El AUC en la ventana común no puede</text><text x="14" y="305.5" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">empeorar más que la tolerancia</text><text x="14" y="324.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">(0,02 por defecto).</text><line x1="200" y1="342" x2="200" y2="366" stroke="#0063b1" stroke-width="2.2" marker-end="url(#fl)"/><rect x="0" y="368" width="400" height="66" rx="6" fill="#eef6ff" stroke="#003769" stroke-width="1.6"/><text x="14" y="393.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="15.5" font-weight="700" fill="#003769" text-anchor="start">2. Construir y probar</text><text x="14" y="415.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Las dos imágenes y los contenedores.</text><line x1="200" y1="436" x2="200" y2="460" stroke="#0063b1" stroke-width="2.2" marker-end="url(#fl)"/><rect x="0" y="462" width="400" height="84" rx="6" fill="#d8eaff" stroke="#002a52" stroke-width="2.6"/><text x="14" y="487.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="15.5" font-weight="700" fill="#003769" text-anchor="start">Puerta 2: aprobación manual</text><text x="14" y="509.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Alguien aprueba el environment</text><text x="14" y="527.5" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">produccion antes de publicar.</text><line x1="200" y1="548" x2="200" y2="572" stroke="#0063b1" stroke-width="2.2" marker-end="url(#fl)"/><rect x="0" y="574" width="400" height="110" rx="6" fill="#eef6ff" stroke="#003769" stroke-width="1.6"/><text x="14" y="599.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="15.5" font-weight="700" fill="#003769" text-anchor="start">3. Publicar y proponer</text><text x="14" y="621.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Sube cafe-api y cafe-interfaz con la</text><text x="14" y="639.5" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">etiqueta v2-... y abre un pull request</text><text x="14" y="658.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">con la nueva referencia.</text><line x1="404" y1="290" x2="468" y2="290" stroke="#6b7280" stroke-width="2.2" marker-end="url(#fl)"/><text x="436" y="278.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#636975" text-anchor="middle">empeora</text><rect x="472" y="240" width="328" height="100" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="488" y="266.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="17" font-weight="700" fill="#374151" text-anchor="start">Rechazada</text><text x="488" y="289.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Se detiene aquí. No se construye</text><text x="488" y="307.5" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#1a1a1a" text-anchor="start">ni se publica nada.</text><text x="488" y="328.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#636975" text-anchor="start">Con la tolerancia por defecto: 0,7951 frente a 0,8525.</text><line x1="404" y1="606" x2="468" y2="606" stroke="#003769" stroke-width="2.4" marker-end="url(#fl)"/><rect x="472" y="574" width="328" height="110" rx="6" fill="#003769" stroke="#003769" stroke-width="1.6"/><text x="488" y="602.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Aprobada</text><text x="488" y="626.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#ffffff" text-anchor="start">Con tolerancia = 0.10 la versión 2</text><text x="488" y="644.5" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#ffffff" text-anchor="start">pasa la puerta 1; tú apruebas la</text><text x="488" y="663.0" font-family="'Segoe UI','Liberation Sans',Arial,sans-serif" font-size="14.5" font-weight="400" fill="#ffffff" text-anchor="start">puerta 2 y se publica.</text></svg>