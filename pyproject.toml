[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cafe-mlops"
version = "0.1.0"
description = "Taller de punta a punta: calidad del café (CQI)"
readme = "README.md"
requires-python = ">=3.11"
# Dependencias para EJECUTAR el pipeline. El entorno completo del curso esta en 03-Entorno/conda/environment.yml
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "openpyxl",   # leer el Excel original
    "mlflow",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "jupyterlab", "ipykernel", "matplotlib", "papermill", "jupytext", "nbclient"]  # httpx: lo usa TestClient en las pruebas de la API
api = ["fastapi", "uvicorn", "pydantic"]

[tool.setuptools.packages.find]
include = ["cafe_mlops*"]

[tool.pytest.ini_options]
testpaths = ["tests", "taller/slides/pruebas"]
markers = ["lento: pruebas que ejecutan los cuadernos de punta a punta"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
